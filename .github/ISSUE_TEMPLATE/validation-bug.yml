name: Validation / Schema bug
description: Something is wrong with the JSON Schema, SHACL shapes, vocabulary, context, converters or validators.
title: "[BUG] <short summary>"
labels: [bug, validation]
assignees: []
body:
  - type: checkboxes
    id: scope
    attributes:
      label: Affected area(s)
      options:
        - label: JSON Schema (datacite.schema.json)
        - label: SHACL shapes (datacite-4.7-r2.shacl.ttl)
        - label: Vocabulary terms (rdf-vocabulary-staging/vocab/*)
        - label: JSON-LD context (fullcontext.jsonld)
        - label: JSON-to-RDF converter (datacite_to_rdf.py)
        - label: XML-to-JSON converter (convert.py) or XML validation (validate_xml.rb)
        - label: Mappings (mappings/*)
  - type: input
    id: ref
    attributes:
      label: Commit / tag
      description: Commit SHA or tag where you observed the issue.
      placeholder: e.g., 2f13ab7 or v0.4.1
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Brief description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: CLI steps or actions to reproduce.
      placeholder: |
        1. Run `npm run --silent validate:json -- record.json`
        2. See error ...
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal JSON example
      description: Smallest possible JSON that triggers the problem.
      render: json
      placeholder: |
        {
          "types": { "resourceTypeGeneral": "Dataset" },
          "creators": [ ... ]
        }
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What should happen vs what actually happens.
      placeholder: "Expected: passes rule X. Actual: fails with message Y."
  - type: textarea
    id: logs
    attributes:
      label: Validator output / stacktrace
      render: shell
  - type: dropdown
    id: severity
    attributes:
      label: Impact
      options:
        - Blocks submission
        - Incorrect validation (false positive/negative)
        - Minor / cosmetic
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I verified on the latest main branch.
        - label: I can help test a fix.
