name: Change proposal (schema, shapes, vocabulary, context)
description: Propose a change to the JSON Schema, SHACL shapes, controlled vocabularies or JSON-LD context.
title: "[PROPOSAL] <short summary>"
labels: [enhancement, discussion]
assignees: []
body:
  - type: dropdown
    id: target
    attributes:
      label: Target
      options:
        - JSON Schema (validation-and-conversion/schemas/schema-profiles/datacite-4.7.schema.json)
        - SHACL shapes (validation-and-conversion/shapes/datacite-4.7-r2.shacl.ttl)
        - Add or rename a vocabulary term (rdf-vocabulary-staging/vocab/*)
        - Class or property definition (rdf-vocabulary-staging/class/*, property/*)
        - JSON-LD context (rdf-vocabulary-staging/context/fullcontext.jsonld)
        - Other (describe below)
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Why this change is needed (standards, UX, adoption, downstream tooling).
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: Proposed change
      description: Be precise. Include JSON Schema snippets or rule pseudocode.
      render: json
      placeholder: |
        {
          "$id": "#/properties/creators/items/properties/nameIdentifier",
          "anyOf": [...]
        }
  - type: textarea
    id: impact
    attributes:
      label: Impact analysis
      description: Affected files, backward compatibility, migration plan, examples.
      placeholder: |
        - Affects rdf-vocabulary-staging/vocab/relationType/
        - Backward compatible? Yes/No
        - Migration: map X -> Y
  - type: textarea
    id: examples
    attributes:
      label: Example records
      description: Realistic JSON before/after (small).
      render: json
  - type: checkboxes
    id: acceptance
    attributes:
      label: Acceptance criteria
      options:
        - label: Validation passes for new examples.
        - label: No regressions on sample corpus.
        - label: Documentation updated (README, index.html).
